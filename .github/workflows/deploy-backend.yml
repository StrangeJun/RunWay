name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build JAR
        run: |
          cd backend
          ./gradlew bootJar -x test

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/runway/app/"
          strip_components: 3

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/runway/app
            # 업로드된 JAR를 runway-api.jar로 교체
            find . -maxdepth 1 -name "*.jar" ! -name "runway-api.jar" -exec mv {} runway-api.jar \; || true
            sudo systemctl restart runway-api
            sleep 8
            if sudo systemctl is-active --quiet runway-api; then
              echo "✅ runway-api started successfully"
            else
              echo "❌ runway-api failed to start"
              sudo journalctl -u runway-api -n 30 --no-pager
              exit 1
            fi
