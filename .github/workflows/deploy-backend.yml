name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build JAR
        run: |
          cd backend
          ./gradlew bootJar -x test

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/runway/app/"
          strip_components: 3

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/runway/app
            # 기존 파일 백업 후 새 JAR로 교체
            ls *.jar 2>/dev/null | grep -v runway-api.jar | xargs -I{} mv {} runway-api.jar || true
            sudo systemctl restart runway-api
            sleep 8
            if sudo systemctl is-active --quiet runway-api; then
              echo "✅ runway-api started successfully"
            else
              echo "❌ runway-api failed to start"
              sudo journalctl -u runway-api -n 30 --no-pager
              exit 1
            fi
