name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Test and build JAR
        run: |
          cd backend
          ./gradlew clean test bootJar

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/runway/app/"
          strip_components: 3

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GEMINI_API_KEY,GEMINI_MODEL
          script: |
            cd /opt/runway/app
            sudo install -d -m 0755 /etc/systemd/system/runway-api.service.d
            printf '[Service]\nEnvironment=GEMINI_API_KEY=%s\nEnvironment=GEMINI_MODEL=%s\n' \
              "$GEMINI_API_KEY" "$GEMINI_MODEL" |
              sudo tee /etc/systemd/system/runway-api.service.d/gemini.conf >/dev/null
            sudo chmod 0600 /etc/systemd/system/runway-api.service.d/gemini.conf
            sudo systemctl daemon-reload
            # 업로드된 JAR를 runway-api.jar로 교체
            find . -maxdepth 1 -name "*.jar" ! -name "runway-api.jar" -exec mv {} runway-api.jar \; || true
            sudo systemctl restart runway-api
            sleep 8
            if sudo systemctl is-active --quiet runway-api; then
              echo "✅ runway-api started successfully"
              sudo systemctl show runway-api -p MainPID -p ActiveEnterTimestamp --no-pager
            else
              echo "❌ runway-api failed to start"
              sudo journalctl -u runway-api -n 30 --no-pager
              exit 1
            fi
