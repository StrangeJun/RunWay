spring:
  application:
    name: runway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/runway}
    username: ${DB_USERNAME:runway}
    password: ${DB_PASSWORD:runway}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

server:
  port: 8080

app:
  upload-dir: ${UPLOAD_DIR:/opt/runway/uploads}
  base-url: ${BASE_URL:https://runway.run}
  mail:
    delivery-mode: ${MAIL_DELIVERY_MODE:smtp}
    from: ${MAIL_FROM:no-reply@runway.run}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:1209600000}

social:
  google:
    client-id: ${GOOGLE_WEB_CLIENT_ID}
  kakao:
    app-id: ${KAKAO_APP_ID}

logging:
  level:
    com.runway: INFO
    org.flywaydb: INFO
